# ThingsFlow — FAIR comparison profile.
#
# Same rule as benchmarks/profiles/fair-thingsboard.yaml:
#   every pod gets a limit >= 3x its observed peak, and ZERO CFS throttling is
#   verified in the level that gets reported.
#
# What changes relative to the previous profile (tf-scaled-values.yaml) and why:
#
#   1. nats-alarms: 1,500m -> 6,000m. It measured 1,360m against 1,500m
#      (90.7%), i.e. it was throttling in the level published as "clean". It was
#      also the largest consumer in the system, so its ceiling bounded the
#      overall result.
#   2. rmqtt-edge: 1 node/1,000m -> 3 raft nodes/2,000m each. The previous ramp
#      compared ONE broker of ours against TWO tb-mqtt-transport, and on top of
#      that with less CPU (1,000m against 1,500m). The asymmetry went against
#      us, not in our favour, but it was asymmetry all the same.
#   3. Everything else goes up to >=3x its peak so that no component is the
#      ceiling.

images:
  # Left unset so the chart uses its own version. For a measurement you want to
  # be able to reproduce months later, pin an exact build here instead:
  #   flowCore: ghcr.io/lirei-lab/thingsflow/flow-core:sha-<short>
  # The previous value pinned a build published under the account this project
  # moved away from, so it no longer resolves.
  flowCore: ""
  pullSecrets: []

flowCore:
  loadDemo: true
  logLevel: "info"

persistence:
  storageClass: microk8s-hostpath

postgres:
  persistence: { enabled: true, size: 8Gi, storageClass: microk8s-hostpath }
  maxConnections: 400
  clientPool:
    maxOpenConns: 40
    maxIdleConns: 10

greptimedb:
  persistence: { enabled: true, size: 20Gi, storageClass: microk8s-hostpath }

nats:
  # Phase 3 (Milestone 4), 2026-08-19: 10Gi -> 14Gi. The PVC-fit guard sums
  # EVERY file-backed stream's max-bytes, not just the three declared below —
  # values.yaml's shipped default for nats.twinEvents (TF_TWIN_EVENTS) is ALSO
  # file-backed, 1Gi, and this profile never overrode or even mentioned it. The
  # comment below still said "4+1+1=6Gi, 1Gi for KV" as if only three streams
  # existed; the real sum was 4+1+1+1=7Gi — exactly the 70%-of-10Gi budget,
  # zero bytes left for the KV. Caught live: the post-upgrade bootstrap hook
  # failed the instant twin_state held a single ~200-byte doc (the single-writer
  # merge design productionized this milestone writes one whole-device doc, not
  # N per-key entries — see files/bento-nats-latest-kv.yaml). 14Gi restores real
  # headroom (70% = 9.8Gi against the same 7Gi of streams = 2.8Gi for the KV)
  # and stays correct even though the new doc-per-device model needs far less
  # of it than the per-key model this profile's old math was reasoning about.
  persistence: { enabled: true, size: 14Gi, storageClass: microk8s-hostpath }
  jetstream:
    maxMemory: "4Gi"
  # The correct key is nats.resources, NOT resources.nats. The previous profile
  # wrote `resources: {nats: {...}}`, which the chart does not read: Helm
  # ignored it silently and NATS ran the whole benchmark with its default value
  # of 500m. Hence the "NATS 501m out of a 500m limit, throttled in 1819
  # periods" that was published as ThingsFlow's MQTT ceiling at 8000 msg/s. It
  # was not the platform: it was a misspelled key.
  resources:
    limits:   { cpu: "6000m", memory: "12Gi" }
    requests: { cpu: "300m",  memory: "512Mi" }
  # These sizes are NOT arbitrary: the verify.sh guard requires that the sum of
  # the max-bytes of every file-backed stream, plus the KV, fits within 70% of
  # the PVC. A first attempt with 8+2+2 = 12Gi (10Gi PVC) made the post-upgrade
  # hook fail, which is exactly what the guard must do: it was written so that
  # the 400GB QuestDB disk-fill does not recur, and it stopped an excess of
  # mine.
  #
  # rawStream + entityStream + alarmIntentStream = 6Gi, PLUS twinEvents below
  # (declared explicitly now, not left as a silent values.yaml default) = 7Gi
  # total file-backed stream caps, against a 9.8Gi budget (70% of the 14Gi PVC
  # above) = 2.8Gi left for the KV. At 16,000 msg/s for 120s that's ~1.9M
  # messages / ~400MB under the OLD per-key model; the new single-writer
  # doc-merge model (one doc per device, not one entry per telemetry key) needs
  # far less than that even at full device count.
  rawStream:         { storage: file, maxBytes: 4Gi, maxAge: "1h" }
  entityStream:      { storage: file, maxBytes: 1Gi, maxAge: "1h" }
  alarmIntentStream: { storage: file, maxBytes: 1Gi, maxAge: "1h" }
  twinEvents:        { storage: file, maxBytes: 1Gi, maxAge: "24h", subjects: ["tf.twin.events.>"] }
  twinKv:            { storage: file, ttl: "1h" }

# --- MQTT front end in a real cluster (raft), 3 nodes ---
# Before: 1 node, because the chart had a fail() that blocked replicas>1.
# The rmqtt-cluster-raft plugin IS shipped in the 0.20.0 image; it simply was
# not configured. Without this the MQTT path is not comparable against the 2
# tb-mqtt-transport on the other side.
rmqttEdge:
  cluster:
    enabled: true
    replicas: 3
  resources:
    limits:   { cpu: "2000m", memory: "2Gi" }
    requests: { cpu: "200m",  memory: "256Mi" }

# --- multi-instance on the hot path ---
natsDataPlane:
  greptimedb:
    replicas: 3
    resources:
      limits:   { cpu: "2000m", memory: "2Gi" }
      requests: { cpu: "150m",  memory: "192Mi" }
  latestKv:
    replicas: 3
    resources:
      limits:   { cpu: "2000m", memory: "2Gi" }
      requests: { cpu: "150m",  memory: "192Mi" }
  alarms:
    # The measured bottleneck. 3x2000m = 6000m against a peak of 1360m.
    replicas: 3
    resources:
      limits:   { cpu: "2000m", memory: "2Gi" }
      requests: { cpu: "150m",  memory: "192Mi" }
  entityGreptimedb:
    replicas: 1
  questdb:
    enabled: false          # no subscriber: it would create an orphan durable

demoSimulator:
  enabled: false            # the load comes from the generator, not the simulator

httpIngest:
  replicas: 3
  gateway:
    resources:
      limits:   { cpu: "3000m", memory: "2Gi" }
      requests: { cpu: "100m",  memory: "128Mi" }
  bento:
    resources:
      limits:   { cpu: "3000m", memory: "2Gi" }
      requests: { cpu: "100m",  memory: "128Mi" }

resources:
  flowCore:
    limits:   { cpu: "3000m", memory: "4Gi" }
    requests: { cpu: "200m",  memory: "256Mi" }
  postgres:
    limits:   { cpu: "6000m", memory: "12Gi" }
    requests: { cpu: "300m",  memory: "512Mi" }
  greptimedb:
    limits:   { cpu: "6000m", memory: "16Gi" }
    requests: { cpu: "500m",  memory: "1Gi" }
  # BEWARE: nats does NOT go here. The chart reads nats.resources (see above),
  # not resources.nats. Writing it here is exactly the mistake that invalidated
  # the previous measurement.
