{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zitadel.fullname" . }}-mailpit
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "zitadel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        {{- include "zitadel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: "{{ .Values.mailpit.image.repository }}:{{ .Values.mailpit.image.tag }}"
          imagePullPolicy: {{ .Values.mailpit.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: {{ .Values.mailpit.smtpPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.mailpit.httpPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zitadel.fullname" . }}-mailpit
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: {{ .Values.mailpit.smtpPort }}
      targetPort: smtp
      protocol: TCP
    - name: http
      port: {{ .Values.mailpit.httpPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "zitadel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
{{- if .Values.mailpit.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zitadel.fullname" . }}-mailpit
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
  {{- with .Values.mailpit.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.mailpit.ingress.className }}
  ingressClassName: {{ .Values.mailpit.ingress.className }}
  {{- end }}
  {{- with .Values.mailpit.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.mailpit.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "zitadel.fullname" $ }}-mailpit
                port:
                  number: {{ $.Values.mailpit.httpPort }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
