{{- if .Values.jobs.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zitadel.fullname" . }}-init
  labels:
    {{- include "zitadel.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
  {{- if or .Values.jobs.useHelmHooks .Values.jobs.init.annotations }}
  annotations:
    {{- if .Values.jobs.useHelmHooks }}
    {{- include "zitadel.hookAnnotations" . | nindent 4 }}
    "helm.sh/hook-weight": "1"
    {{- end }}
    {{- with .Values.jobs.init.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.jobs.init.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.jobs.init.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "zitadel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "zitadel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      enableServiceLinks: false
      containers:
        - name: zitadel-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - init
            - --config
            - /config/config-yaml
            - --config
            - /secret-config/{{ include "zitadel.secretConfigSecretKey" . }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "zitadel.fullname" . }}-config
            defaultMode: 0440
        - name: secret-config
          secret:
            secretName: {{ include "zitadel.secretConfigSecretName" . }}
            defaultMode: 0440
{{- end }}
