# Controlled pilot example values.
#
# This file is safe to commit: it references operator-owned Kubernetes Secrets
# and placeholder public hostnames only. Use it as the starting point for a
# serious pilot, then copy it to a private overlay with real domains, storage
# classes, and secret names.

production: true

global:
  domain: "thingsflow-pilot.example.com"

ingress:
  enabled: true
  className: nginx
  host: "thingsflow-pilot.example.com"
  tls: true
  clusterIssuer: "letsencrypt-prod"

flowCore:
  env: "production"
  allowedOrigin: "https://thingsflow-pilot.example.com"
  loadDemo: false
  logLevel: "info"
  logFormat: "json"
  alarmEventLogLevel: "info"
  deviceInactivityTimeoutSeconds: 120
  jwtTokenSigningKeyExistingSecret:
    name: "thingsflow-platform-keys"
    key: "jwt-token-signing-key"
  deviceJwt:
    privateKeyExistingSecret:
      name: "thingsflow-device-jwt"
      key: "device-jwt-es256-private-key-pem-b64"
    additionalPublicJwksExistingSecret:
      name: "thingsflow-device-jwt"
      key: "previous-public-jwks-b64"
    ttlSeconds: 3600

postgres:
  username: "postgres"
  passwordExistingSecret:
    name: "thingsflow-postgres"
    key: "password"
  database: "thingsboard"

retention:
  greptimedb:
    enabled: true
    ttl: "90d"

greptimedb:
  persistence:
    enabled: true
    size: 100Gi

oidc:
  enabled: true
  providerId: "pilot-oidc"
  providerTitle: "Pilot SSO"
  clientId: "thingsflow-ui"
  issuer: "https://idp.example.com/realms/thingsflow"
  userInfoUrl: "https://idp.example.com/realms/thingsflow/protocol/openid-connect/userinfo"
  redirectUrl: "https://thingsflow-pilot.example.com/login/oauth2/code/pilot-oidc"
  defaultTenantId: "aaaaaaaa-1dd2-11b2-8080-808080808080"
  defaultAuthority: "TENANT_ADMIN"
  allowUserCreation: false
  clientSecretExistingSecret:
    name: "thingsflow-oidc"
    key: "client-secret"
  stateSigningKeyExistingSecret:
    name: "thingsflow-oidc"
    key: "state-signing-key"

testAuth:
  enabled: false

nats:
  enabled: true
  replicas: 1
  auth:
    enabled: true
    existingSecret:
      name: "thingsflow-nats-auth"
      userKey: "username"
      passwordKey: "password"
  jetstream:
    maxMemory: "1Gi"
    storeDir: "/data/jetstream"
  persistence:
    enabled: true
    storageClass: ""
    size: 50Gi
  rawStream:
    storage: "file"
    maxAge: "24h"
  latestStream:
    storage: "file"
    maxAge: "24h"
  alarmIntentStream:
    storage: "file"
    maxAge: "24h"
  twinKv:
    storage: "file"
    history: 1
    ttl: "24h"
  resources:
    limits:
      cpu: "1000m"
      memory: "1536Mi"
    requests:
      cpu: "250m"
      memory: "512Mi"

rmqttEdge:
  enabled: true
  replicas: 1
  serviceType: ClusterIP
  allowAnonymous: false
  logLevel: "error"
  resources:
    limits:
      cpu: "2000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

httpIngest:
  enabled: true
  replicas: 2
  serviceType: ClusterIP
  jwt:
    jwksCacheSeconds: 300
  gateway:
    logLevel: "warn"
    resources:
      limits:
        cpu: "750m"
        memory: "384Mi"
      requests:
        cpu: "150m"
        memory: "128Mi"
  bento:
    resources:
      limits:
        cpu: "750m"
        memory: "384Mi"
      requests:
        cpu: "150m"
        memory: "128Mi"

natsDataPlane:
  enabled: true
  historyStore: "greptimedb"
  latestKv:
    enabled: true
    # 1, not 2: this consumer is the single-writer doc-merge (KV get -> merge ->
    # set per message), serialized by the durable's max_ack_pending=1. See
    # values.yaml and files/bento-nats-latest-kv.yaml. Scaling it out is the
    # sharded-merge work, not a replica bump.
    replicas: 1
    resources:
      limits:
        cpu: "1500m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  greptimedb:
    enabled: true
    replicas: 2
    resources:
      limits:
        cpu: "1500m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  questdb:
    enabled: false
  alarms:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: "1000m"
        memory: "768Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"

alarmMaterializer:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: "750m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "192Mi"

demoSimulator:
  enabled: false

persistence:
  storageClass: ""
  postgres:
    size: 30Gi
  greptimedb:
    size: 100Gi
  questdb:
    size: 100Gi

resources:
  flowCore:
    limits:
      cpu: "1500m"
      memory: "1Gi"
    requests:
      cpu: "300m"
      memory: "384Mi"
  tbWebUi:
    limits:
      memory: "384Mi"
    requests:
      memory: "128Mi"
  postgres:
    limits:
      memory: "2Gi"
    requests:
      memory: "768Mi"
  greptimedb:
    limits:
      cpu: "2000m"
      memory: "6Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
  questdb:
    limits:
      memory: "6Gi"
    requests:
      memory: "2Gi"

backup:
  enabled: true
  schedule: "0 3 * * *"
  retentionDays: 14
  s3:
    pathStyle: false
    existingSecret:
      name: "thingsflow-backup-s3"
      endpointKey: "endpoint"
      bucketKey: "bucket"
      regionKey: "region"
      accessKeyKey: "access-key"
      secretKeyKey: "secret-key"
  postgres:
    enabled: true
  # GreptimeDB exports itself to the bucket (server-side COPY DATABASE):
  # this is the backup that protects the telemetry history.
  greptimedb:
    enabled: true
  questdb:
    enabled: false
