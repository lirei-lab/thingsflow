{{- $fresh := (.Values.monitoring | default dict).freshnessGuard | default dict }}
{{- $freshEnabled := true }}
{{- if hasKey $fresh "enabled" }}
{{- $freshEnabled = $fresh.enabled }}
{{- end }}
{{- if and (.Values.greptimedb.enabled | default true) (eq (.Values.timeseries.store | default "greptimedb") "greptimedb") $freshEnabled }}
# Data-plane freshness guard (silent-halt detection). The GreptimeDB ingest-halt
# incident went undetected ~14h because every pod stayed Running/200 while writes
# had silently stopped (dead core NATS sub). This CronJob queries the newest row
# in device_telemetry_kv every few minutes: if ZERO telemetry landed in the last
# STALE_MINUTES it exits non-zero, leaving a persistent FAILED Job — that failed
# Job IS the alert surface (no Prometheus scrape stack; same convention as the
# ttl-guard). A metric line is also emitted for a future exporter.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "thingsflow.fullname" . }}-greptimedb-freshness-guard
  namespace: {{ .Release.Namespace | default "thingsflow" }}
  labels:
    app: greptimedb-freshness-guard
spec:
  # Every 5 minutes by default; overridable via .Values.monitoring.freshnessGuard.schedule.
  schedule: {{ $fresh.schedule | default "*/5 * * * *" | quote }}
  # Declared EXPLICITLY, not omitted.
  #
  # A CronJob without `suspend` in the manifest can be stopped by hand with
  # kubectl and NO `helm upgrade` will ever re-enable it: Helm only reasserts the
  # fields it manages. It really happened -- the freshness-guard had been
  # suspended for 47 hours, invisible to the deployment, while the chart said
  # `enabled: true`.
  #
  # BEWARE, this line ALONE is not enough to recover a guard already suspended by
  # hand. `kubectl patch` makes kubectl the owner of the field and Helm's
  # server-side apply REFUSES to change it:
  #
  #   Apply failed with 1 conflict: conflict with "kubectl-patch": .spec.suspend
  #
  # Ownership has to be reclaimed ONCE with `helm upgrade --force-conflicts`
  # (not `--force`, which is incompatible with server-side apply). After that,
  # any normal upgrade keeps it active.
  #
  # In a system whose core value is that retention is VERIFIED, a guard that can
  # be silently switched off and does not come back on its own is exactly the
  # failure that must be prevented.
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  # Keep failed Jobs visible — they ARE the alert surface.
  failedJobsHistoryLimit: 8
  jobTemplate:
    spec:
      # One shot per tick: a failed tick STAYS failed = alertable. No retry into green.
      backoffLimit: 0
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app: greptimedb-freshness-guard
        spec:
          restartPolicy: Never
          volumes:
          - name: probe
            emptyDir: {}
          # Reads the backlog BEFORE the guard queries GreptimeDB, so the guard can
          # tell a halted writer from an idle platform. It runs as an init container
          # because the psql image has no HTTP client at all -- no curl, no wget, no
          # python -- while the nats-box image already pinned by this chart has both
          # the nats CLI and jq.
          #
          # It ALWAYS exits 0. An init container that fails takes the whole Job with
          # it, which would turn "NATS was briefly unreachable" into a false halt
          # alert. Failure is encoded in the file instead, and the guard decides.
          initContainers:
          - name: backlog-probe
            image: {{ .Values.nats.cliImage | quote }}
            imagePullPolicy: {{ .Values.images.pullPolicy }}
            env:
            - name: NATS_URL
              value: {{ include "thingsflow.natsURLLiteral" . | quote }}
            - name: HISTORY_STREAM
              value: {{ (.Values.natsDataPlane.greptimedb).stream | default "TF_RAW" | quote }}
            - name: HISTORY_DURABLE
              value: {{ (.Values.natsDataPlane.greptimedb).durable | default "thingsflow-greptimedb-durable" | quote }}
            command:
            - /bin/sh
            - -c
            - |
              set -u
              INFO=$(nats --server "${NATS_URL}" consumer info \
                "${HISTORY_STREAM}" "${HISTORY_DURABLE}" --json 2>/dev/null)
              if [ -z "${INFO}" ]; then
                echo "unknown" > /probe/backlog
                echo "[backlog-probe] could not read consumer ${HISTORY_STREAM}/${HISTORY_DURABLE}"
                exit 0
              fi
              # Waiting work is undelivered plus delivered-but-unacked: a consumer
              # that died mid-flight leaves messages in the second bucket, and
              # counting only num_pending would miss exactly that shape of halt.
              BACKLOG=$(printf '%s' "${INFO}" | jq -r '(.num_pending // 0) + (.num_ack_pending // 0)' 2>/dev/null)
              case "${BACKLOG}" in ''|*[!0-9]*) BACKLOG="unknown" ;; esac
              echo "${BACKLOG}" > /probe/backlog
              echo "[backlog-probe] ${HISTORY_STREAM}/${HISTORY_DURABLE} backlog=${BACKLOG}"
              exit 0
            volumeMounts:
            - name: probe
              mountPath: /probe
          containers:
          - name: freshness-guard
            image: {{ .Values.images.postgres | quote }}
            imagePullPolicy: {{ .Values.images.pullPolicy }}
            volumeMounts:
            - name: probe
              mountPath: /probe
            env:
            - name: GREPTIMEDB_SERVICE
              value: {{ include "thingsflow.fullname" . }}-greptimedb
            - name: GREPTIMEDB_PORT
              value: {{ .Values.greptimedb.postgresPort | default 4003 | quote }}
            - name: GREPTIMEDB_DATABASE
              value: {{ .Values.greptimedb.database | default "public" | quote }}
            - name: GREPTIMEDB_TABLE
              value: {{ .Values.greptimedb.table | default "device_telemetry_kv" | quote }}
            # A halt is "no rows landed in the whole table for this many minutes".
            # Sized well above the device publish interval so a normal cadence never
            # trips it, but far below the incident's 14h blind spot.
            - name: STALE_MINUTES
              value: {{ $fresh.staleMinutes | default 15 | quote }}
            command:
            - /bin/sh
            - -c
            - |
              set -u
              DSN="postgres://${GREPTIMEDB_SERVICE}:${GREPTIMEDB_PORT}/${GREPTIMEDB_DATABASE}?sslmode=disable"
              # STALE_MINUTES is interpolated into SQL; assert it is a bare integer.
              case "${STALE_MINUTES}" in ''|*[!0-9]*) echo "[freshness-guard] invalid STALE_MINUTES='${STALE_MINUTES}'" >&2; exit 2 ;; esac
              if ! psql "$DSN" -Atc "SELECT 1" >/dev/null 2>&1; then
                echo "thingsflow_greptimedb_write_stale 1"
                echo "[freshness-guard] ALERT: cannot reach GreptimeDB at ${GREPTIMEDB_SERVICE}:${GREPTIMEDB_PORT}"
                exit 1
              fi
              N=$(psql "$DSN" -Atc "SELECT count(*) FROM ${GREPTIMEDB_TABLE} WHERE greptime_timestamp > now() - INTERVAL '${STALE_MINUTES} minutes';" 2>/dev/null)
              N=$(printf '%s' "${N}" | tr -d '[:space:]')
              case "${N}" in ''|*[!0-9]*) N=0 ;; esac
              if [ "${N}" -eq 0 ]; then
                # Distinguish "ingest stopped" from "nothing has ever arrived".
                #
                # A fresh install has no devices yet, so a window query legitimately
                # returns 0 and this guard fired on every brand-new deployment. A
                # guard that always alerts on install is a guard operators learn to
                # ignore, which costs exactly the signal it exists to provide.
                #
                # Total row count separates the two: zero overall means the platform
                # has simply never received telemetry, which is a normal state to be
                # in before the first device is provisioned. Rows present but none
                # recent is the real halt.
                TOTAL=$(psql "$DSN" -Atc "SELECT count(*) FROM ${GREPTIMEDB_TABLE};" 2>/dev/null)
                TOTAL=$(printf '%s' "${TOTAL}" | tr -d '[:space:]')
                case "${TOTAL}" in ''|*[!0-9]*) TOTAL=0 ;; esac
                if [ "${TOTAL}" -eq 0 ]; then
                  echo "thingsflow_greptimedb_write_stale 0"
                  echo "[freshness-guard] no telemetry yet in ${GREPTIMEDB_TABLE}: the platform has never received data. Not an alert on a fresh install; provision a device and publish to start the clock."
                  exit 0
                fi
                # Rows exist but none are recent. That is NOT yet a halt: it is
                # equally the shape of a platform where nobody is publishing right
                # now -- an evaluation cluster after a load test, a small pilot
                # overnight, a fleet between duty cycles. Alerting on it made this
                # guard fail every 5 minutes forever on an idle test cluster, which
                # is the same way it used to fail on every fresh install.
                #
                # What separates the two is whether there is WORK WAITING. The
                # incident this guard exists for -- a dead NATS subscription while
                # every pod stayed Running and the edge kept returning 200 -- has
                # messages piling up in the stream with nothing draining them. An
                # idle platform has an empty backlog because nothing was published.
                BACKLOG=$(cat /probe/backlog 2>/dev/null | tr -d '[:space:]')
                case "${BACKLOG}" in ''|*[!0-9]*) BACKLOG="unknown" ;; esac
                if [ "${BACKLOG}" = "0" ]; then
                  echo "thingsflow_greptimedb_write_stale 0"
                  echo "[freshness-guard] idle: no rows in the last ${STALE_MINUTES}m (${TOTAL} total), but the history consumer backlog is 0 — nothing was published, nothing is stuck. Not an alert."
                  exit 0
                fi
                echo "thingsflow_greptimedb_write_stale 1"
                if [ "${BACKLOG}" = "unknown" ]; then
                  # Deliberately alerts. Not being able to read the backlog is not
                  # evidence of health, and swallowing it would reintroduce exactly
                  # the silent blind spot this guard was written for.
                  echo "[freshness-guard] ALERT: 0 telemetry rows in ${GREPTIMEDB_TABLE} in the last ${STALE_MINUTES}m, but ${TOTAL} rows exist — and the history consumer backlog could not be read, so a halt cannot be ruled out"
                  exit 1
                fi
                echo "[freshness-guard] ALERT: 0 telemetry rows in ${GREPTIMEDB_TABLE} in the last ${STALE_MINUTES}m, but ${TOTAL} rows exist and ${BACKLOG} message(s) are waiting on the history consumer — data-plane ingest is halted"
                exit 1
              fi
              echo "thingsflow_greptimedb_write_stale 0"
              echo "[freshness-guard] OK: ${N} telemetry row(s) in the last ${STALE_MINUTES}m"
{{- end }}
