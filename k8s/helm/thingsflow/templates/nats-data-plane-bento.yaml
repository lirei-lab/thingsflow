apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-alarms
  labels:
    app: nats-alarms
data:
  config.yaml: |
{{ .Files.Get "files/bento-nats-alarms.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-alarms
  labels:
    app: nats-alarms
spec:
  replicas: {{ $alarms.replicas | default 1 }}
  selector:
    matchLabels:
      app: nats-alarms
  template:
    metadata:
      annotations:
        checksum/bento-nats-alarms: {{ .Files.Get "files/bento-nats-alarms.yaml" | sha256sum }}
      labels:
        app: nats-alarms
    spec:
      initContainers:
      - name: wait-for-nats
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z -w 2 {{ include "thingsflow.fullname" . }}-nats {{ .Values.nats.clientPort | default 4222 }}; do
            sleep 2
          done
      containers:
      - name: bento
        image: {{ $image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bento", "-c", "/etc/bento/config.yaml"]
        env:
{{ include "thingsflow.natsAuthEnv" . | indent 8 }}
        - name: NATS_URL
          value: {{ $natsURL | quote }}
        - name: NATS_RAW_SUBJECT
          value: {{ $rawSubject | quote }}
        - name: NATS_QUEUE_GROUP
          value: {{ ($alarms.deliverGroup | default ($alarms.queueGroup | default "thingsflow-nats-alarms")) | quote }}
        # Durable JetStream bind:true input (mirrors greptimedb/latest-kv). subject must
        # equal the consumer filter_subject or NATS rejects the attach.
        - name: NATS_STREAM
          value: {{ ($alarms.stream | default "TF_RAW") | quote }}
        - name: NATS_DURABLE
          value: {{ ($alarms.durable | default "thingsflow-alarms-durable") | quote }}
        - name: NATS_FILTER_SUBJECT
          value: {{ ($alarms.filterSubject | default "tf.ingest.>") | quote }}
        - name: NATS_ALARM_INTENT_PREFIX
          value: {{ ($alarms.intentSubjectPrefix | default "tf.alarm.intent") | quote }}
        - name: DEFAULT_TENANT_ID
          value: {{ ($dp.defaultTenantId | default "aaaaaaaa-1dd2-11b2-8080-808080808080") | quote }}
        # Energy thresholds, matched per circuit by key suffix. See values.yaml
        # for why the clear thresholds sit inside the trip band.
        {{- $energy := ((.Values.alarms | default dict).energy | default dict) }}
        - name: ALARM_DEMAND_HIGH_W
          value: {{ ($energy.demandHighW | default 5000) | quote }}
        - name: ALARM_DEMAND_CLEAR_W
          value: {{ ($energy.demandClearW | default 4500) | quote }}
        - name: ALARM_VOLTAGE_HIGH_V
          value: {{ ($energy.voltageHighV | default 253) | quote }}
        - name: ALARM_VOLTAGE_LOW_V
          value: {{ ($energy.voltageLowV | default 207) | quote }}
        - name: ALARM_VOLTAGE_CLEAR_HIGH_V
          value: {{ ($energy.voltageClearHighV | default 248) | quote }}
        - name: ALARM_VOLTAGE_CLEAR_LOW_V
          value: {{ ($energy.voltageClearLowV | default 212) | quote }}
        - name: ALARM_TEMPERATURE_HIGH
          value: {{ ($alarmThresholds.temperatureHigh | default "30") | quote }}
        - name: ALARM_TEMPERATURE_CLEAR
          value: {{ ($alarmThresholds.temperatureClear | default "29") | quote }}
        - name: ALARM_CO2_HIGH
          value: {{ ($alarmThresholds.co2High | default "1000") | quote }}
        - name: ALARM_CO2_CLEAR
          value: {{ ($alarmThresholds.co2Clear | default "900") | quote }}
        - name: ALARM_IAQ_LOW
          value: {{ ($alarmThresholds.iaqLow | default "50") | quote }}
        - name: ALARM_IAQ_CLEAR
          value: {{ ($alarmThresholds.iaqClear | default "70") | quote }}
        - name: METRICS_PORT
          value: {{ ($alarms.metricsPort | default 4199) | quote }}
        ports:
        - name: http
          containerPort: {{ $alarms.metricsPort | default 4199 }}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        # /ping is a static 200 and /ready does not flip on a dead NATS input
        # (measured -- see thingsflow.bentoNatsLivenessProbe). This probe checks
        # the socket, the only signal that tracks the real failure.
        livenessProbe:
{{ include "thingsflow.bentoNatsLivenessProbe" . | indent 10 }}
        resources:
{{ toYaml ($alarms.resources | default (dict "limits" (dict "cpu" "750m" "memory" "512Mi") "requests" (dict "cpu" "100m" "memory" "128Mi"))) | indent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/bento
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "thingsflow.fullname" . }}-nats-alarms
{{- end }}
{{- end }}
