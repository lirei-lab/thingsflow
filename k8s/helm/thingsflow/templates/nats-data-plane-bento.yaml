spec:
  replicas: {{ $entityGt.replicas | default 1 }}
  selector:
    matchLabels:
      app: nats-entity-greptimedb
  template:
    metadata:
      annotations:
        checksum/bento-nats-entity-greptimedb: {{ .Files.Get "files/bento-nats-entity-greptimedb.yaml" | sha256sum }}
      labels:
        app: nats-entity-greptimedb
    spec:
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z -w 2 {{ include "thingsflow.fullname" . }}-nats {{ .Values.nats.clientPort | default 4222 }} \
            && nc -z -w 2 {{ include "thingsflow.fullname" . }}-greptimedb {{ .Values.greptimedb.httpPort | default 4000 }}; do
            sleep 2
          done
      containers:
      - name: bento
        image: {{ $image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bento", "-c", "/etc/bento/config.yaml"]
        env:
{{ include "thingsflow.natsAuthEnv" . | indent 8 }}
        - name: NATS_URL
          value: {{ $natsURL | quote }}
        - name: NATS_ENTITY_SUBJECT
          value: {{ ($entityGt.subject | default "tf.entity.telemetry.raw.events") | quote }}
        - name: NATS_QUEUE_GROUP
          value: {{ ($entityGt.deliverGroup | default ($entityGt.queueGroup | default "thingsflow-nats-entity-greptimedb")) | quote }}
        # DURA-01: durable JetStream input binds (bind:true) to the entity consumer on TF_ENTITY.
        # WR-02: ack_wait/max_ack_pending are NOT passed — the bound consumer's live policy owns them.
        - name: NATS_STREAM
          value: {{ ($entityGt.stream | default "TF_ENTITY") | quote }}
        - name: NATS_DURABLE
          value: {{ ($entityGt.durable | default "thingsflow-entity-greptimedb-durable") | quote }}
        # DURA-01 fix: bind:true subscribe subject must equal the bound consumer's filter_subject.
        - name: NATS_FILTER_SUBJECT
          value: {{ ($entityGt.filterSubject | default "tf.entity.telemetry.raw.>") | quote }}
        - name: GREPTIMEDB_INFLUX_URL
          value: "http://{{ include "thingsflow.fullname" . }}-greptimedb:{{ .Values.greptimedb.httpPort | default 4000 }}/v1/influxdb/write?db={{ .Values.greptimedb.database | default "public" }}&precision=ns"
        - name: GREPTIMEDB_TABLE
          value: {{ ($entityGt.table | default "entity_telemetry_kv") | quote }}
        - name: METRICS_PORT
          value: {{ ($entityGt.metricsPort | default 4201) | quote }}
        ports:
        - name: http
          containerPort: {{ $entityGt.metricsPort | default 4201 }}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        # /ping is a static 200 and /ready does not flip on a dead NATS input
        # (measured -- see thingsflow.bentoNatsLivenessProbe). This probe checks
        # the socket, the only signal that tracks the real failure.
        livenessProbe:
{{ include "thingsflow.bentoNatsLivenessProbe" . | indent 10 }}
        resources:
{{ toYaml ($entityGt.resources | default (dict "limits" (dict "cpu" "500m" "memory" "256Mi") "requests" (dict "cpu" "50m" "memory" "96Mi"))) | indent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/bento
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "thingsflow.fullname" . }}-nats-entity-greptimedb
{{- end }}
{{- if and (eq $historyStore "questdb") ($questdb.enabled | default false) }}
