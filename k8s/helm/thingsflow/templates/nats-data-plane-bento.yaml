{{- if .Values.natsDataPlane.enabled }}
{{- $dp := .Values.natsDataPlane | default dict }}
{{- $latest := $dp.latestKv | default dict }}
{{- $historyStore := $dp.historyStore | default (.Values.timeseries.store | default "greptimedb") }}
{{- $greptimedb := $dp.greptimedb | default dict }}
{{- $questdb := $dp.questdb | default dict }}
{{- $alarms := $dp.alarms | default dict }}
{{- $alarmThresholds := $alarms.thresholds | default dict }}
{{- $image := $dp.image | default .Values.images.bento | default "ghcr.io/warpstreamlabs/bento:1.8.1" }}
{{- $natsURL := $dp.natsUrl | default (include "thingsflow.natsURL" .) }}
{{- $rawSubject := $dp.rawSubject | default "tf.ingest.*.raw.>" }}
{{- if ($latest.enabled | default true) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-latest-kv
  labels:
    app: nats-latest-kv
data:
  config.yaml: |
{{ .Files.Get "files/bento-nats-latest-kv.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-latest-kv
  labels:
    app: nats-latest-kv
spec:
  replicas: {{ $latest.replicas | default 1 }}
  selector:
    matchLabels:
      app: nats-latest-kv
  template:
    metadata:
      annotations:
        checksum/bento-nats-latest-kv: {{ .Files.Get "files/bento-nats-latest-kv.yaml" | sha256sum }}
      labels:
        app: nats-latest-kv
    spec:
      initContainers:
      - name: wait-for-nats
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z -w 2 {{ include "thingsflow.fullname" . }}-nats {{ .Values.nats.clientPort | default 4222 }}; do
            sleep 2
          done
      containers:
      - name: bento
        image: {{ $image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bento", "-c", "/etc/bento/config.yaml"]
        env:
{{ include "thingsflow.natsAuthEnv" . | indent 8 }}
        # Phase 3 (Milestone 4): LATEST_KV_MAX_IN_FLIGHT (the old per-key
        # output's publish concurrency) is gone — the output is now a single
        # cache set per message, then drop. LATEST_KV_MAX_ACK_PENDING must
        # equal $latest.maxAckPending, the same value the durable consumer is
        # created/converged with (templates/nats.yaml) — Bento's own default
        # for this field (1024) does not match this consumer's deliberate 1,
        # and an unset field asserts Bento's default rather than inheriting
        # the consumer's, so the bind fails on mismatch if this drifts from
        # values.yaml (verified live — see files/bento-nats-latest-kv.yaml).
        - name: LATEST_KV_MAX_ACK_PENDING
          value: {{ $latest.maxAckPending | default 1 | quote }}
        - name: NATS_URL
          value: {{ $natsURL | quote }}
        - name: NATS_RAW_SUBJECT
          value: {{ $rawSubject | quote }}
        - name: NATS_QUEUE_GROUP
          value: {{ ($latest.deliverGroup | default ($latest.queueGroup | default "thingsflow-nats-latest-kv")) | quote }}
        # Durable JetStream bind:true input (mirrors greptimedb). subject must equal the
        # consumer filter_subject or NATS rejects the attach.
        - name: NATS_STREAM
          value: {{ ($latest.stream | default "TF_RAW") | quote }}
        - name: NATS_DURABLE
          value: {{ ($latest.durable | default "thingsflow-latest-kv-durable") | quote }}
        - name: NATS_FILTER_SUBJECT
          value: {{ ($latest.filterSubject | default "tf.ingest.>") | quote }}
        - name: NATS_KV_BUCKET
          value: {{ ($latest.bucket | default (.Values.nats.twinKv.bucket | default "twin_state")) | quote }}
        - name: DEFAULT_TENANT_ID
          value: {{ ($dp.defaultTenantId | default "aaaaaaaa-1dd2-11b2-8080-808080808080") | quote }}
        - name: METRICS_PORT
          value: {{ ($latest.metricsPort | default 4197) | quote }}
        ports:
        - name: http
          containerPort: {{ $latest.metricsPort | default 4197 }}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        # /ping is a static 200 and /ready does not flip on a dead NATS input
        # (measured -- see thingsflow.bentoNatsLivenessProbe). This probe checks
        # the socket, the only signal that tracks the real failure.
        livenessProbe:
{{ include "thingsflow.bentoNatsLivenessProbe" . | indent 10 }}
        resources:
{{ toYaml ($latest.resources | default (dict "limits" (dict "cpu" "750m" "memory" "512Mi") "requests" (dict "cpu" "100m" "memory" "128Mi"))) | indent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/bento
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "thingsflow.fullname" . }}-nats-latest-kv
{{- end }}
{{- if and (eq $historyStore "greptimedb") ($greptimedb.enabled | default true) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-greptimedb
  labels:
    app: nats-greptimedb
data:
  config.yaml: |
{{ .Files.Get "files/bento-nats-greptimedb.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-greptimedb
  labels:
    app: nats-greptimedb
spec:
  replicas: {{ $greptimedb.replicas | default 1 }}
  selector:
    matchLabels:
      app: nats-greptimedb
  template:
    metadata:
      annotations:
        checksum/bento-nats-greptimedb: {{ .Files.Get "files/bento-nats-greptimedb.yaml" | sha256sum }}
      labels:
        app: nats-greptimedb
    spec:
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z -w 2 {{ include "thingsflow.fullname" . }}-nats {{ .Values.nats.clientPort | default 4222 }} \
            && nc -z -w 2 {{ include "thingsflow.fullname" . }}-greptimedb {{ .Values.greptimedb.httpPort | default 4000 }}; do
            sleep 2
          done
      containers:
      - name: bento
        image: {{ $image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bento", "-c", "/etc/bento/config.yaml"]
        env:
{{ include "thingsflow.natsAuthEnv" . | indent 8 }}
        - name: NATS_URL
          value: {{ $natsURL | quote }}
        - name: NATS_RAW_SUBJECT
          value: {{ $rawSubject | quote }}
        - name: NATS_QUEUE_GROUP
          value: {{ ($greptimedb.deliverGroup | default ($greptimedb.queueGroup | default "thingsflow-nats-greptimedb")) | quote }}
        # DURA-01: durable JetStream input binds (bind:true) to the pre-created consumer (06-02).
        # WR-02: ack_wait/max_ack_pending are NOT passed — with bind:true the bound consumer's
        # live policy (set by the bootstrap hook, asserted by verify.sh) is the sole owner of
        # those fields, so the input no longer references NATS_ACK_WAIT / NATS_MAX_ACK_PENDING.
        - name: NATS_STREAM
          value: {{ ($greptimedb.stream | default "TF_RAW") | quote }}
        - name: NATS_DURABLE
          value: {{ ($greptimedb.durable | default "thingsflow-greptimedb-durable") | quote }}
        # DURA-01 fix: with bind:true the subscribe subject must EQUAL the bound consumer's
        # filter_subject, else NATS rejects the attach with "subject does not match consumer".
        - name: NATS_FILTER_SUBJECT
          value: {{ ($greptimedb.filterSubject | default "tf.ingest.>") | quote }}
        - name: DEFAULT_TENANT_ID
          value: {{ ($dp.defaultTenantId | default "aaaaaaaa-1dd2-11b2-8080-808080808080") | quote }}
        - name: GREPTIMEDB_INFLUX_URL
          value: "http://{{ include "thingsflow.fullname" . }}-greptimedb:{{ .Values.greptimedb.httpPort | default 4000 }}/v1/influxdb/write?db={{ .Values.greptimedb.database | default "public" }}&precision=ns"
        - name: GREPTIMEDB_TABLE
          value: {{ ($greptimedb.table | default (.Values.greptimedb.table | default "device_telemetry_kv")) | quote }}
        - name: METRICS_PORT
          value: {{ ($greptimedb.metricsPort | default 4198) | quote }}
        ports:
        - name: http
          containerPort: {{ $greptimedb.metricsPort | default 4198 }}
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        # /ping is a static 200 and /ready does not flip on a dead NATS input
        # (measured -- see thingsflow.bentoNatsLivenessProbe). This probe checks
        # the socket, the only signal that tracks the real failure.
        livenessProbe:
{{ include "thingsflow.bentoNatsLivenessProbe" . | indent 10 }}
        resources:
{{ toYaml ($greptimedb.resources | default (dict "limits" (dict "cpu" "750m" "memory" "512Mi") "requests" (dict "cpu" "100m" "memory" "128Mi"))) | indent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/bento
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "thingsflow.fullname" . }}-nats-greptimedb
{{- end }}
{{- $entityGt := $dp.entityGreptimedb | default dict }}
{{- if and (eq $historyStore "greptimedb") ($entityGt.enabled | default true) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "thingsflow.fullname" . }}-nats-entity-greptimedb
  labels:
