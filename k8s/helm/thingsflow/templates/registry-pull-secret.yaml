{{- $registryPullSecret := .Values.registryPullSecret | default dict }}
{{- if ($registryPullSecret.create | default false) }}
#
# Optional dockerconfigjson secret for pulling from a private or mirrored
# registry. Skip when using public ThingsFlow images.
# Reference it from values.yaml as:
#   images.pullSecrets: [{{ include "thingsflow.fullname" . }}-registry]
#
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thingsflow.fullname" . }}-registry
  labels:
    app: registry-pull-secret
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        {{ $registryPullSecret.registry | quote }}: {
          "username": {{ $registryPullSecret.username | quote }},
          "password": {{ $registryPullSecret.password | quote }},
          "auth": {{ printf "%s:%s" $registryPullSecret.username $registryPullSecret.password | b64enc | quote }}
        }
      }
    }
{{- end }}
