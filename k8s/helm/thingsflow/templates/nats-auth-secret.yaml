{{- $auth := .Values.nats.auth | default dict }}
{{- $existing := $auth.existingSecret | default dict }}
{{- if and (eq (include "thingsflow.natsAuthEnabled" .) "true") (not $existing.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thingsflow.natsAuthSecretName" . }}
  labels:
    app: nats
type: Opaque
stringData:
  {{ include "thingsflow.natsAuthUserKey" . }}: {{ ($auth.user | default "thingsflow") | quote }}
  {{ include "thingsflow.natsAuthPasswordKey" . }}: {{ $auth.password | quote }}
{{- end }}
