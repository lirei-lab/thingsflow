# EXAMPLE operator overlay. Copy to values-cluster.yaml (git-ignored) and fill in
# your own hosts, image pin and endpoints. Kept public so the shape of a real
# deployment overlay is documented without publishing a specific cluster.
#
# This file intentionally references Kubernetes Secrets generated by
# tools/generate-pilot-secrets.sh. Do not put secret values here.

production: true

global:
  domain: "thingsflow.example.com"

# Pin the flow-core image to a concrete build instead of the floating ":main"
# default (DEFER-05-C). flow-core + alarm-materializer share this single binary
# image. A floating tag means a pod reschedule/scale can silently pull a
# different build, and ":main" was not pullable on this cluster.
images:
  flowCore: "ghcr.io/lirei-uqtr/thingsflow/flow-core:<pin-a-concrete-build>"

ingress:
  enabled: true
  className: nginx
  host: "thingsflow.example.com"
  tls: true
  clusterIssuer: "letsencrypt-prod"

flowCore:
  env: "production"
  allowedOrigin: "https://thingsflow.example.com"
  loadDemo: false
  logLevel: "info"
  logFormat: "json"
  alarmEventLogLevel: "info"
  deviceInactivityTimeoutSeconds: 120
  # Advertised in the UI "Check connectivity" dialog. MQTT-over-TLS endpoint is the
  # MetalLB LB (public <PUBLIC_IP>:8883 -> mqtt.example.com).
  deviceConnectivity:
    mqttHost: "mqtt.example.com"
    mqttPort: 8883
  jwtTokenSigningKeyExistingSecret:
    name: "thingsflow-platform-keys"
    key: "jwt-token-signing-key"
  deviceJwt:
    privateKeyExistingSecret:
      name: "thingsflow-device-jwt"
      key: "device-jwt-es256-private-key-pem-b64"
    additionalPublicJwksExistingSecret:
      name: "thingsflow-device-jwt"
      key: "previous-public-jwks-b64"
    # 15-minute device-JWT TTL (was 3600). Shrinks the blast radius of a leaked
    # token from 1h to 15m; there is no ingest-time revocation, so TTL IS the
    # revocation window. Safe because the edge forwarder refreshes proactively
    # (DEVICE_JWT_REFRESH_MARGIN_SECONDS=300 → refresh at ~10m age, 5m retry buffer).
    ttlSeconds: 900

postgres:
  username: "postgres"
  passwordExistingSecret:
    name: "thingsflow-postgres"
    key: "password"
  database: "thingsboard"
  nodeSelector:
    kubernetes.io/hostname: lirei-02
  persistence:
    enabled: true
    storageClass: ""   # empty -> template omits storageClassName -> default SC (rook-ceph-block)
    size: 30Gi

timeseries:
  store: "greptimedb"

greptimedb:
  enabled: true
  persistence:
    enabled: true
    storageClass: ""   # empty -> template omits storageClassName -> default SC (rook-ceph-block)
    size: 100Gi

# Retention moved to the top-level retention.greptimedb.* key (CLEAN-02 / D-02);
# greptimedb.retention.* now fails the Helm render via _validations.tpl. Cluster
# intent is an explicit 90d GreptimeDB native TTL (matches the base default).
retention:
  greptimedb:
    enabled: true
    ttl: "90d"

questdb:
  enabled: false

oidc:
  enabled: false

testAuth:
  enabled: false

nats:
  enabled: true
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: lirei-01
  auth:
    enabled: true
    existingSecret:
      name: "thingsflow-nats-auth"
      userKey: "username"
      passwordKey: "password"
  jetstream:
    maxMemory: "1Gi"
    storeDir: "/data/jetstream"
  persistence:
    enabled: true
    storageClass: ""   # empty -> template omits storageClassName -> default SC (rook-ceph-block)
    size: 50Gi
  rawStream:
    storage: "file"
    maxAge: "24h"
    # D-02 measure-first cap = measured live 24h state.bytes (102541497 B, ~102.5 MB,
    # full-window: discard=old + max_age=24h ⇒ steady-state) × 2, rounded up to Gi.
    # ceil(205082994 B / 1Gi) = 1Gi = 1073741824 bytes (Plan 02 guard compares int bytes).
    maxBytes: "1Gi"
  # D-08 TF_ENTITY overlay: file-backed, 24h, capped. TF_ENTITY does not exist on the
  # live cluster yet so it has no measured state.bytes; seeded conservatively at 1Gi per
  # the D-08 low-rate rationale. Re-measure + refine after Task 3 creates it (Plan 02).
  entityStream:
    storage: "file"
    maxAge: "24h"
    maxBytes: "1Gi"
  latestStream:
    storage: "file"
    maxAge: "24h"
    # File-backed on the shared 50Gi PVC — cap it so the drift guard's PVC-fit
    # assertion passes (uncapped file stream = unbounded = fail loud, D-03).
    # Low-volume latest-value stream; 1Gi is generous vs TF_RAW's measured ~102MB/24h.
    maxBytes: "1Gi"
  alarmIntentStream:
    storage: "file"
    maxAge: "24h"
    maxBytes: "1Gi"
  twinKv:
    storage: "file"
    history: 1
    ttl: "24h"
  resources:
    limits:
      cpu: "1000m"
      memory: "1536Mi"
    requests:
      cpu: "250m"
      memory: "512Mi"

persistence:
  storageClass: ""   # empty -> template omits storageClassName -> default SC (rook-ceph-block)
  postgres:
    size: 30Gi
  greptimedb:
    size: 100Gi
  questdb:
    size: 100Gi

rmqttEdge:
  enabled: true
  replicas: 1
  serviceType: ClusterIP
  allowAnonymous: false
  logLevel: "error"
  # MQTT-over-TLS on 8883 (mqtt.example.com) using a cert-manager Let's Encrypt
  # cert (DNS-01 via Route53). The external LoadBalancer (172.19.1.146:8883, NAT'd
  # from public <PUBLIC_IP>:8883) forwards to this TLS listener. Device-JWT auth
  # (JWT in the MQTT username) applies to the TLS listener too.
  tls:
    enabled: true
    port: 8883
    secretName: "rmqtt-mqtt-tls"
  resources:
    limits:
      cpu: "2000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

httpIngest:
  enabled: true
  replicas: 2
  serviceType: ClusterIP
  jwt:
    jwksCacheSeconds: 300
  gateway:
    logLevel: "warn"
    resources:
      limits:
        cpu: "750m"
        memory: "384Mi"
      requests:
        cpu: "150m"
        memory: "128Mi"
  bento:
    resources:
      limits:
        cpu: "750m"
        memory: "384Mi"
      requests:
        cpu: "150m"
        memory: "128Mi"

natsDataPlane:
  enabled: true
  latestKv:
    enabled: true
    replicas: 2
    resources:
      limits:
        cpu: "1500m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  greptimedb:
    enabled: true
    replicas: 2
    # Phase-6 durable-consumer policy (06-02 Task 1): research defaults adopted at the sizing
    # checkpoint (operator choice; live GreptimeDB p99 re-measure logged as a follow-up). The
    # durable/stream/filterSubject defaults from values.yaml are correct on the cluster; only the
    # measured timing/ceiling values are overlaid here so they are the single cluster source of truth.
    durable: "thingsflow-greptimedb-durable"
    maxDeliver: 500
    ackWait: "30s"
    backoff: "1s,5s,15s,30s,60s"
    maxAckPending: 1024
    resources:
      limits:
        cpu: "1500m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  entityGreptimedb:
    enabled: true
    # Phase-6 durable-consumer policy (06-02 Task 1): research defaults (operator choice).
    durable: "thingsflow-entity-greptimedb-durable"
    maxDeliver: 500
    ackWait: "30s"
    backoff: "1s,5s,15s,30s,60s"
    maxAckPending: 1024
  questdb:
    enabled: false
  alarms:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: "1000m"
        memory: "768Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"

alarmMaterializer:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: "750m"
      memory: "512Mi"
    requests:
      cpu: "150m"
      memory: "192Mi"

demoSimulator:
  enabled: false
  replicas: 1
  publishIntervalSeconds: 5
  deviceJwtRefreshMarginSeconds: 300
  logLevel: "info"

backup:
  enabled: false

resources:
  flowCore:
    limits:
      cpu: "1500m"
      memory: "1Gi"
    requests:
      cpu: "300m"
      memory: "384Mi"
  tbWebUi:
    limits:
      memory: "384Mi"
    requests:
      memory: "128Mi"
  postgres:
    limits:
      memory: "2Gi"
    requests:
      memory: "768Mi"
  greptimedb:
    limits:
      cpu: "2000m"
      memory: "6Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
