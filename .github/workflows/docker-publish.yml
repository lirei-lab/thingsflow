#
# Build and publish flow-core images to ghcr.io.
# The chart's images.flowCore defaults to the CHART VERSION (see
# templates/flow-core.yaml), so a released chart pulls the image built from the
# matching v<version> git tag. That tag only exists once a release is cut: a
# repository that has only ever seen branch pushes has :latest, :<branch> and
# :sha-<short>, but no semver tag, and the chart default will not resolve.
#
# Triggers:
#   - push to default branch → :<branch>, :latest, :sha-<short>
#   - push to any other branch → :<branch>, :sha-<short>
#   - git tag v<version>     → :v<version>, :<version>, :<major>.<minor>, :latest, :sha-<short>
#
# :latest comes from docker/metadata-action's default flavor (latest=auto), not
# from an explicit rule in the tags list below -- which is why reading the tags
# list alone suggests it does not exist. It does; the registry has it.
#   - tag v*              → :<tag>, :sha-<short>, :latest      (release cut)
#   - manual dispatch     → :manual-<short>                    (debug rebuild)
#
# Notes for maintainers:
#   - flow-core/tb-resources/system_images/ is committed to the repo (~18 MB
#     across 891 files). When bumping to a new TB OSS version, refresh those
#     bytes locally with:
#         python3 tools/python/extract-system-images.py             # 233 from git history
#         bash tools/import-tb-system-images.sh              # 460 from upstream tb-postgres pod
#         bash tools/dump-system-images-to-files.sh          # snapshot DB → committed files
#     then commit the diff. The build itself does NOT run those scripts.

name: Build and Publish Docker Images

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    # Self-hosted Actions Runner Controller scale set on the lirei-lab org
    # (label `sti-k8s`, minRunners 0 / maxRunners 4, scale-from-zero), the same
    # runner syntgrid uses. TO GO BACK TO GITHUB-HOSTED RUNNERS, replace
    # `sti-k8s` with `ubuntu-latest` below. With no matching runner online a job
    # queues (scale-from-zero may take a minute to spin up).
    runs-on: sti-k8s
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag scheme: branch refs add :{{branch}}, tags add semver, all builds
      # carry :sha-<short>. master/main and tags also move :latest.
      - name: Compute image metadata for flow-core
        id: meta-flow-core
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thingsflow/flow-core
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # Semver WITHOUT the leading v. The tag trigger is 'v*', so
            # type=ref,event=tag alone only ever produces 'v2.1.0' -- while the
            # chart default and the install docs referenced '2.1.0' and '4.4.0',
            # neither of which any build had ever produced. Those references
            # pointed at images that could not exist.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push flow-core
        uses: docker/build-push-action@v5
        with:
          context: ./flow-core
          file: ./flow-core/Dockerfile
          push: true
          tags: ${{ steps.meta-flow-core.outputs.tags }}
          labels: ${{ steps.meta-flow-core.outputs.labels }}
          cache-from: type=gha,scope=flow-core
          cache-to: type=gha,scope=flow-core,mode=max
