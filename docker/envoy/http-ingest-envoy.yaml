admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: http_ingest
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: thingsflow_http_ingest
                route_config:
                  name: thingsflow_http_ingest
                  virtual_hosts:
                    - name: thingsflow_http_ingest
                      domains: ["*"]
                      routes:
                        - match:
                            path: /api/v1/telemetry
                          route:
                            cluster: bento_http_ingest
                            timeout: 10s
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        thingsflow_device:
                          issuer: thingsflow-device
                          audiences:
                            - thingsflow-mqtt
                          remote_jwks:
                            http_uri:
                              uri: http://flow-core:8080/api/noauth/device-jwks
                              cluster: flow_core_jwks
                              timeout: 2s
                            cache_duration:
                              seconds: 300
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          forward: false
                          payload_in_metadata: thingsflow_device
                          forward_payload_header: x-thingsflow-jwt-payload
                          claim_to_headers:
                            - header_name: x-thingsflow-tenant-id
                              claim_name: tenantId
                            - header_name: x-thingsflow-device-id
                              claim_name: deviceId
                            - header_name: x-thingsflow-device-name
                              claim_name: deviceName
                            - header_name: x-thingsflow-mqtt-id
                              claim_name: mqttId
                      rules:
                        - match:
                            path: /api/v1/telemetry
                          requires:
                            provider_name: thingsflow_device
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(handle)
                          local claims = nil
                          local metadata = handle:streamInfo():dynamicMetadata()
                          for _, namespace in pairs(metadata) do
                            if namespace["thingsflow_device"] ~= nil then
                              claims = namespace["thingsflow_device"]
                            end
                          end
                          if claims == nil then
                            return
                          end
                          local function copy_claim(header, value)
                            if value ~= nil then
                              handle:headers():replace(header, tostring(value))
                            end
                          end
                          copy_claim("x-thingsflow-tenant-id", claims["tenantId"])
                          copy_claim("x-thingsflow-device-id", claims["deviceId"] or claims["sub"])
                          copy_claim("x-thingsflow-device-name", claims["deviceName"])
                          copy_claim("x-thingsflow-mqtt-id", claims["mqttId"] or claims["sub"])
                        end
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 1048576
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: bento_http_ingest
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: bento_http_ingest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: http-ingest-bento
                      port_value: 8082
    - name: flow_core_jwks
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: flow_core_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: flow-core
                      port_value: 8080
