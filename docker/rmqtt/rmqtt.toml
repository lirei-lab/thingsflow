task.exec_workers = 128
task.exec_queue_max = 100_000

node.id = 1
rpc.server_addr = "0.0.0.0:5363"

log.to = "console"
log.level = "warn"
log.dir = "/var/log/rmqtt"
log.file = "rmqtt.log"

plugins.dir = "/app/rmqtt/etc/plugins"
plugins.default_startups = [
  "rmqtt-auth-jwt",
  "rmqtt-acl",
  "rmqtt-bridge-egress-nats",
  "rmqtt-http-api",
]

mqtt.max_sessions = 100000

listener.tcp.external.addr = "0.0.0.0:1883"
listener.tcp.external.max_connections = 100000
listener.tcp.external.max_handshaking_limit = 1000
listener.tcp.external.handshake_timeout = "30s"
listener.tcp.external.max_packet_size = "1MB"
listener.tcp.external.backlog = 1024
listener.tcp.external.nodelay = true
listener.tcp.external.allow_anonymous = false
listener.tcp.external.allow_zero_keepalive = false
listener.tcp.external.min_keepalive = 10
listener.tcp.external.max_keepalive = 300
listener.tcp.external.keepalive_backoff = 0.75
listener.tcp.external.max_inflight = 32
listener.tcp.external.max_mqueue_len = 1000
listener.tcp.external.mqueue_rate_limit = "5000,1s"
listener.tcp.external.max_qos_allowed = 1
listener.tcp.external.max_topic_levels = 8
listener.tcp.external.session_expiry_interval = "30m"
listener.tcp.external.message_retry_interval = "20s"
listener.tcp.external.message_expiry_interval = "5m"
listener.tcp.external.shared_subscription = false
listener.tcp.external.max_topic_aliases = 0

listener.tcp.internal.enable = false
