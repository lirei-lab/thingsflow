[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thingsflow-device-sdk"
version = "0.1.0"
description = "Lightweight Python SDK for ThingsFlow device provisioning and telemetry"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ThingsFlow" }]
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=1.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["thingsflow_device_sdk*", "thingsflow_device_sdk*"]
